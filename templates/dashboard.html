<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .chart-container {
            margin-bottom: 50px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .chart-container h2 {
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>LEGO Dashboard</h1>
    
    <div class="chart-container">
        <h2>Sets by Theme</h2>
        {{ graphs['sets_by_theme']|safe }}
    </div>
    
    <div class="chart-container">
        <h2>Sets Released Per Year</h2>
        {{ graphs['sets_by_year']|safe }}
    </div>
    
    <div class="chart-container">
        <h2>Most Frequent Parts</h2>
        {{ graphs['parts']|safe }}
    </div>
    
    <div class="chart-container">
        <h2>Minifigures by Set</h2>
        {{ graphs['minifigs']|safe }}
    </div>
    
    <div class="chart-container">
        <h2>Missing Parts by Set</h2>
        {{ graphs['missing_parts']|safe }}
    </div>
</body>
</html>
